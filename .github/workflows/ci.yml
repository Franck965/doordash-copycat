name: doordash-copycat-fd1

on:
  push:
    branches: [main]

jobs:
  doordash_docker:
    runs-on: ubuntu-latest
    steps:
      - name: check out the repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build docker image
        run: |
          docker build . -t fd-doordash
      - name: run the container
        run: |
          docker run -d \
          -p 8080:8080 \
          --name doordash-fee \
          fd-doordash
      - name: Wait for API to be ready
        run: |
          echo "Waiting for API to be ready on http://localhost:8080 ..."
          for i in {1..10}; do
            if curl -sSf http://localhost:8080/status/ > /dev/null; then
              echo "API is up ✅"
              exit 0
            fi
            echo "API not ready yet, retrying in 3s..."
            sleep 3
          done
          echo "API failed to start ❌"
          docker logs fee-service || true
          exit 1
      - name: test GET/
        run: |
          curl -sSf http://localhost:8080/ || exit 1
      - name: test POST/calculate fee
        run: |
          curl -sSf -X POST http://localhost:8080/calculate-fee/ \
            -H "Content-Type: application/json" \
            -d '{"distance_km": 10.5, "weight_kg": 2.0}' \
            || exit 1
      - name: test GET/estimate-time
        run: |
          curl -sSf http://localhost:8080/estimate-time/5 || exit 1
      - name: test GET/status
        run: |
          curl -sSf http://localhost:8080/status/ || exit 1
      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest httpx fastapi
      - name: exécuter les tests
        run: pytest tests/ -v
      - name: arrêter le container
        run: |
          docker stop doordash-fee || true
          docker rm doordash-fee || true
          docker ps -a